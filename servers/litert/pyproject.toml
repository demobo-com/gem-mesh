[project]
name = "meshnode"
version = "0.1.0"
description = "Local AI Tiered Mesh node: OpenAI-compatible server over LiteRT-LM with session KV reuse and mDNS advertisement"
requires-python = ">=3.12"
dependencies = [
  "meshcore",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
meshnode = "meshnode.app:main"

[tool.uv.sources]
meshcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshnode"]
