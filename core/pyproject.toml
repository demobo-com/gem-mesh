[project]
name = "meshcore"
version = "0.1.0"
description = "Local AI Tiered Mesh: discovery, router, nodes, profiles, policy"
requires-python = ">=3.12"
dependencies = [
  "litert-lm==0.18.1",
  "zeroconf>=0.140",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cryptography>=43",
]

[project.scripts]
mesh = "meshcore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshcore"]
