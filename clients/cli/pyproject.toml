[project]
name = "gem-mesh"
version = "0.1.0"
description = "Gem Mesh thin clients: the laptop chat, the phone stand-in, operator tools, and the optional Claude Code shim"
requires-python = ">=3.12"
dependencies = [
  "meshcore",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pypdf>=5.0",
  "fpdf2>=2.8",
  "pillow>=11.0",
  "qrcode>=7.4",
]

[project.scripts]
gem-mesh = "gem_mesh.main:main"
gemmesh = "gem_mesh.main:main"
gem-mesh-mobile = "gem_mesh.main:main_mobile"

[tool.uv.sources]
meshcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gem_mesh"]
